# Wydanie: tag v<wersja> (ta sama co w Directory.Build.props) → testy, paczka Windows x64, paczka Linux arm64 (Raspberry Pi),
# APK Android (gdy są sekrety klucza), próby instalacji skryptami (Windows i arm64) i wydanie na GitHubie z plikami:
# Glebosaurus-<wersja>-win-x64.zip, install-windows.ps1, Glebosaurus-<wersja>-linux-arm64.tar.gz, install-linux.sh,
# SHA256SUMS i Glebosaurus-<wersja>-android.apk.
# Usługi zainstalowane skryptami znajdą je same (Windows: przy starcie i codziennie o 03:30; Linux: timer o tych samych porach).
name: Wydanie

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Tag zgodny z wersją w Directory.Build.props
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME nie zgadza się z wersją $version w Directory.Build.props." }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Testy
        run: dotnet test --solution Glebosaurus.slnx -c Release

      - name: Paczka Windows
        shell: pwsh
        run: ./deploy/package-windows.ps1 -OutputDir out

      # Raspberry Pi (faza 2.3a): paczka zależna od frameworka i install-linux.sh – wiersze dopisane do tego samego SHA256SUMS.
      - name: Paczka Linux arm64
        shell: pwsh
        run: ./deploy/package-linux.ps1 -OutputDir out

      # Agent Android: APK podpisany kluczem wydań z sekretów repozytorium (ANDROID_KEYSTORE_BASE64 – plik klucza w base64,
      # ANDROID_KEYSTORE_PASSWORD – hasło). Bez nich wydanie wychodzi bez APK (Windows aktualizuje się jak dotąd).
      - name: APK Android
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if (-not $env:ANDROID_KEYSTORE_BASE64 -or -not $env:ANDROID_KEYSTORE_PASSWORD) {
            Write-Host '::warning::Brak sekretów klucza Android – wydanie bez APK.'
            exit 0
          }
          $keystore = Join-Path $env:RUNNER_TEMP 'glebosaurus-android.keystore'
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          [IO.File]::WriteAllText("$keystore.password", $env:ANDROID_KEYSTORE_PASSWORD)
          dotnet workload install android
          if ($LASTEXITCODE -ne 0) { throw "workload install: $LASTEXITCODE" }
          ./deploy/build-android.ps1 -AndroidSdk $env:ANDROID_HOME -JavaSdk $env:JAVA_HOME_17_X64 -Keystore $keystore -InstallDependencies -OutputDir out
          Remove-Item $keystore, "$keystore.password"
          $apk = Get-Item 'out/Glebosaurus-${{ steps.version.outputs.version }}-android.apk'
          $line = '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 -LiteralPath $apk.FullName).Hash.ToLowerInvariant(), $apk.Name
          [IO.File]::AppendAllText((Resolve-Path out/SHA256SUMS).Path, "$line`n", (New-Object Text.UTF8Encoding($false)))

      - name: Próba instalacji z paczki (Windows PowerShell 5.1, bez zadania Harmonogramu)
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'glebosaurus'
          & ./out/install-windows.ps1 -PackagePath "out/Glebosaurus-${{ steps.version.outputs.version }}-win-x64.zip" -InstallDir $dir -NoTask -NoStart
          $reported = & (Join-Path $dir 'app/glebosaurus.exe') --version
          if ($reported -ne '${{ steps.version.outputs.version }}') { throw "glebosaurus --version: $reported" }
          if (-not (Test-Path (Join-Path $dir 'app/glebosaurus-service.exe'))) { throw 'Brak glebosaurus-service.exe.' }
          & ./out/install-windows.ps1 -InstallDir $dir -NoTask -Uninstall -RemoveData
          if (Test-Path $dir) { throw "Odinstalowanie zostawiło $dir." }

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            out/*.zip
            out/*.tar.gz
            out/*.apk
            out/install-windows.ps1
            out/install-linux.sh
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  # Paczka Linux na prawdziwym arm64 (jak Raspberry Pi OS 64-bit): skróty, instalacja skryptem z wydania, wersja, odinstalowanie.
  linux:
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: out

      - name: ASP.NET Core Runtime 10 w /opt/dotnet (jak w README)
        run: |
          curl -fsSLO https://dot.net/v1/dotnet-install.sh
          sudo bash dotnet-install.sh --channel 10.0 --runtime aspnetcore --install-dir /opt/dotnet
          sudo ln -sf /opt/dotnet/dotnet /usr/local/bin/dotnet

      - name: Próba instalacji z paczki (bez systemd)
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          (cd out && sha256sum -c --ignore-missing SHA256SUMS)
          dir="$RUNNER_TEMP/glebosaurus"
          bash out/install-linux.sh --no-systemd --prefix "$dir" --package "out/Glebosaurus-$VERSION-linux-arm64.tar.gz"
          reported="$(dotnet "$dir/app/glebosaurus.dll" --version)"
          [ "$reported" = "$VERSION" ] || { echo "glebosaurus --version: $reported"; exit 1; }
          bash "$dir/install-linux.sh" --no-systemd --prefix "$dir" --uninstall --remove-data
          [ ! -e "$dir" ] || { echo "Odinstalowanie zostawiło $dir."; exit 1; }

  publish:
    needs: [build, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: out

      - name: Wydanie na GitHubie
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = '${{ needs.build.outputs.version }}'
          $notes = @"
          Glebosaurus $version – monitor czujników gleby Tuya BLE.

          **Windows 11** (na koncie użytkownika, bez administratora): pobierz i uruchom skrypt instalacji –
          ``````powershell
          `$s = "`$env:TEMP\glebosaurus-install.ps1"
          Invoke-WebRequest https://github.com/${{ github.repository }}/releases/latest/download/install-windows.ps1 -OutFile `$s -UseBasicParsing
          powershell -NoProfile -ExecutionPolicy Bypass -File `$s
          ``````
          Szczegóły (przejęcie istniejącej konfiguracji, aktualizacje, odinstalowanie): README.md, sekcja "Windows: instalacja jako usługa".

          **Raspberry Pi / Linux arm64** (64-bit; na razie jako nadawca maili bez czytania czujników – "bluetooth": false;
          wymaga ASP.NET Core Runtime 10): usługa systemd z samoaktualizacją –
          ``````bash
          curl -fsSLO https://github.com/${{ github.repository }}/releases/latest/download/install-linux.sh
          sudo bash install-linux.sh
          ``````
          Szczegóły (runtime .NET, konfiguracja, rejestracja, aktualizacje): README.md, sekcja "Raspberry Pi: nadawca maili".

          **Android** (agent zbierający, telefon na ładowarce): Glebosaurus-$version-android.apk – instalacja i rejestracja kodem QR:
          README.md, sekcja "Android: agent zbierający".
          "@
          $files = @("out/Glebosaurus-$version-win-x64.zip", 'out/install-windows.ps1', "out/Glebosaurus-$version-linux-arm64.tar.gz",
                     'out/install-linux.sh', 'out/SHA256SUMS')
          if (Test-Path "out/Glebosaurus-$version-android.apk") { $files += "out/Glebosaurus-$version-android.apk" }
          gh release create $env:GITHUB_REF_NAME @files --title "Glebosaurus $version" --notes $notes --verify-tag
